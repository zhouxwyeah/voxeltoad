# golangci-lint configuration. Run via `make lint`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # package-level doc comments already enforced by review
  exclusions:
    # Preserve v1's default exclusions during the v2 configuration migration.
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Allow the no-op stub adapter/test helpers to skip some checks.
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - third_party$
      - builtin$
      - examples$
      - '(^|/)node_modules/'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - elite-model-gateway
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - '(^|/)node_modules/'
